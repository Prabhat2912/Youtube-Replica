<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23C8FF2E'/%3E%3Cpath d='M19 15.5v17l14.5-8.5L19 15.5Z' fill='%230A0A0F'/%3E%3Cellipse cx='24' cy='24' rx='20' ry='9' transform='rotate(-18 24 24)' stroke='%23FF5A1F' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="author" content="PlayTube" />
    <meta
      name="description"
      content="PlayTube — the after-dark screening room for video. Premieres, live cuts and creator rooms, guarded by email verification."
    />
    <meta
      name="keywords"
      content="PlayTube, video premieres, watch videos, upload video, creator rooms, live cuts, channels"
    />
    <link rel="canonical" href="https://playtube.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayTube" />
    <meta property="og:title" content="PlayTube — a lighter home for video" />
    <meta
      property="og:description"
      content="Watch trending videos, follow channels and share your own on PlayTube — fast, calm and email-verified."
    />
    <meta property="og:url" content="https://playtube.vercel.app/" />
    <meta property="og:image" content="https://playtube.vercel.app/og-cover.png" />
    <meta property="og:image:alt" content="PlayTube video feed preview" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlayTube — a lighter home for video" />
    <meta
      name="twitter:description"
      content="Watch trending videos, follow channels and share your own on PlayTube."
    />
    <meta name="twitter:image" content="https://playtube.vercel.app/og-cover.png" />

    <title>PlayTube — a lighter home for video</title>

    <!-- Structured data: WebSite (helps Google + AI answer engines) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PlayTube",
        "url": "https://playtube.vercel.app/",
        "description": "A lighter, calmer home for video. Watch, share and verify with email codes.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://playtube.vercel.app/search?q={query}",
          "query-input": "required name=query"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
